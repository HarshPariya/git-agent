services:
  # ── MongoDB Atlas (or local MongoDB for dev) ──────────────────────────────
  # Note: For production, use MongoDB Atlas with connection string.
  # This local MongoDB is for development/testing only.

  # ── Application Server ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-ai_chatbot}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-groq/compound}
      MAX_RAG_CONTEXT_TOKENS: ${MAX_RAG_CONTEXT_TOKENS:-1200}
      MAX_RETRIEVED_CHUNKS: ${MAX_RETRIEVED_CHUNKS:-4}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      # Optional: restrict which workspace paths can be configured via x-workspace-root header
      # WORKSPACE_ALLOWLIST: /home/user/projects,/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
