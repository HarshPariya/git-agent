name: Production CI Pipeline

on:
  push:
    branches:
      - development
      - main
      - "feature/**"
  pull_request:
    branches:
      - development
      - main

jobs:
  ci:
    name: Build, Migrate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai_chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/ai_chatbot_test
      PORT: 3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build Application
        run: npm run build

      - name: Run Database Migrations
        run: npm run db:migrate

      - name: Run Database Connection Tests
        run: npm run db:test

      - name: Run Vector Search Tests
        run: npm run db:vector

      - name: Run Core Test Suite
        run: npm test

      - name: Run Security Tests
        run: npm run rag:security-test

      - name: Run RAG Limits Tests
        run: npm run rag:limits-test

      - name: Run GraphRAG Tests
        run: npm run rag:graph

      - name: Run Hybrid Retrieval Tests
        run: npm run rag:hybrid

      - name: Run Retrieval Integration Tests
        run: npm run rag:retrieve

      - name: Run Full RAG Integration Test
        run: npm run rag:integration-test

      - name: Run Tool Search Code Test
        run: npm run tool:search-code

      - name: Run Tool Impact Analysis Test
        run: npm run tool:impact-analysis

  rag-evaluation:
    name: RAG Evaluation & Benchmarks
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai_chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/ai_chatbot_test
      PORT: 3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Database Migrations
        run: npm run db:migrate

      - name: Run RAG Benchmarks & Evaluation
        run: npm run rag:eval
