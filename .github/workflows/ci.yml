name: CI

on:
  push:
    branches: [development, main, "feature/**"]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

# ──────────────────────────────────────────────────────────────────────────────
# Jobs run in parallel unless `needs` declares a dependency.
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  # ── 1. Lint & Format ────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  # ── 2. Type Check ──────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: TypeScript
        run: npm run typecheck

  # ── 3. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Compile TypeScript
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ── 4. Tests (core suite) ──────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
          MONGO_INITDB_DATABASE: ai_chatbot_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://testuser:testpass@localhost:27017
      MONGODB_DB_NAME: ai_chatbot_test
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run Core Test Suite
        run: npm test
        timeout-minutes: 10

  # ── 5. Security & Guardrails ───────────────────────────────────────────────
  security:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
          MONGO_INITDB_DATABASE: ai_chatbot_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://testuser:testpass@localhost:27017
      MONGODB_DB_NAME: ai_chatbot_test
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Security Tests
        run: npm run rag:security-test
        timeout-minutes: 5

      - name: Guardrails & Limits
        run: npm run rag:limits-test
        timeout-minutes: 5

  # ── 6. RAG Integration (main / development only) ──────────────────────────
  rag:
    name: RAG Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(fromJson('["development","main"]'), github.ref_name)
    needs: [test]
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
          MONGO_INITDB_DATABASE: ai_chatbot_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://testuser:testpass@localhost:27017
      MONGODB_DB_NAME: ai_chatbot_test
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: DB Connection Tests
        run: npm run db:test
        timeout-minutes: 5

      - name: Vector Search Tests
        run: npm run db:vector
        timeout-minutes: 5

      - name: GraphRAG Tests
        run: npm run rag:graph
        timeout-minutes: 5

      - name: Hybrid Retrieval Tests
        run: npm run rag:hybrid
        timeout-minutes: 5

      - name: Retriever Tests
        run: npm run rag:retrieve
        timeout-minutes: 5

      - name: Integration Tests
        run: npm run rag:integration-test
        timeout-minutes: 10

  # ── 7. RAG Evaluation (main / development only) ───────────────────────────
  rag-eval:
    name: RAG Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(fromJson('["development","main"]'), github.ref_name)
    needs: [rag]
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
          MONGO_INITDB_DATABASE: ai_chatbot_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://testuser:testpass@localhost:27017
      MONGODB_DB_NAME: ai_chatbot_test
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: RAG Evaluation & Benchmarks
        run: npm run rag:eval
        timeout-minutes: 15

  # ── 8. Docker Build ───────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: git-agent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
